<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        input,
        textarea,
        button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            background: #111;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #333;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        #response {
            margin-top: 15px;
            padding: 20px;
            background: #f7f7f7;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        #rawResponse {
            margin-top: 15px;
            padding: 15px;
            background: #111;
            color: #0f0;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Gemini API Test</h1>

        <label>Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="Paste your Gemini API key here">

        <label>Prompt</label>
        <textarea
            id="prompt">Hello Gemini! Please confirm that my API request is working and reply with a short message.</textarea>

        <button onclick="testGemini()">
            Test Gemini API
        </button>

        <div id="status"></div>

        <h3>Gemini Response</h3>
        <div id="response">Waiting for API response...</div>

        <h3>Raw API Response</h3>
        <div id="rawResponse">Waiting...</div>

    </div>

    <script>

        async function testGemini() {

            const apiKey = document.getElementById("apiKey").value.trim();
            const prompt = document.getElementById("prompt").value.trim();

            const status = document.getElementById("status");
            const responseBox = document.getElementById("response");
            const rawResponseBox = document.getElementById("rawResponse");

            if (!apiKey) {
                status.textContent = "❌ Please enter your Gemini API key.";
                return;
            }

            if (!prompt) {
                status.textContent = "❌ Please enter a prompt.";
                return;
            }

            status.textContent = "⏳ Sending request to Gemini...";
            responseBox.textContent = "";
            rawResponseBox.textContent = "";

            try {

                const response = await fetch(
                    "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "x-goog-api-key": apiKey
                        },

                        body: JSON.stringify({
                            contents: [
                                {
                                    parts: [
                                        {
                                            text: prompt
                                        }
                                    ]
                                }
                            ]
                        })
                    }
                );

                const data = await response.json();

                // Show complete API response
                rawResponseBox.textContent =
                    JSON.stringify(data, null, 2);

                if (!response.ok) {

                    status.textContent =
                        `❌ API ERROR - HTTP ${response.status}`;

                    responseBox.textContent =
                        data?.error?.message ||
                        "Gemini API request failed.";

                    return;
                }

                // Extract Gemini generated text
                const generatedText =
                    data?.candidates?.[0]?.content?.parts
                        ?.map(part => part.text || "")
                        .join("") ||
                    "No text returned.";

                status.textContent =
                    "✅ Gemini API is working successfully!";

                responseBox.textContent =
                    generatedText;

            } catch (error) {

                status.textContent =
                    "❌ Request failed.";

                responseBox.textContent =
                    error.message;

                rawResponseBox.textContent =
                    JSON.stringify(error, null, 2);
            }
        }

    </script>

</body>

</html>
